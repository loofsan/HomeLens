[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homelens"
version = "0.1.0"
description = "Backend for the HomeLens housing research application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4"]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pandas>=3,<4",
    "pandas-stubs>=3,<4",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "shapely>=2.1,<2.2",
    "types-shapely>=2.1,<2.2",
    "scikit-learn>=1.6,<2",
]
notebook = [
    "ipykernel>=6,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5,<6",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
